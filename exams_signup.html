      #nprogress {
        pointer-events: none;
      }
      #nprogress .bar {
        background: #29D;
        position: fixed;
        z-index: 9999;
        top: 0;
        left: 0;
        width: 100%;
        height: 3px;
      }
      #nprogress .peg {
        display: block;
        position: absolute;
        right: 0px;
        width: 100px;
        height: 100%;
        box-shadow: 0 0 10px #29D, 0 0 5px #29D;
        opacity: 1;
        -webkit-transform: rotate(3deg) translate(0px, -4px);
        -ms-transform: rotate(3deg) translate(0px, -4px);
        transform: rotate(3deg) translate(0px, -4px);
      }
      #nprogress .spinner {
        display: block;
        position: fixed;
        z-index: 1031;
        top: 15px;
        right: 15px;
      }
      #nprogress .spinner-icon {
        width: 18px;
        height: 18px;
        box-sizing: border-box;
        border: solid 2px transparent;
        border-top-color: #29D;
        border-left-color: #29D;
        border-radius: 50%;
        -webkit-animation: nprogresss-spinner 400ms linear infinite;
        animation: nprogress-spinner 400ms linear infinite;
      }
      .nprogress-custom-parent {
        overflow: hidden;
        position: relative;
      }
      .nprogress-custom-parent #nprogress .spinner,
      .nprogress-custom-parent #nprogress .bar {
        position: absolute;
      }
      @-webkit-keyframes nprogress-spinner {
        0% {
          -webkit-transform: rotate(0deg);
        }
        100% {
          -webkit-transform: rotate(360deg);
        }
      }
      @keyframes nprogress-spinner {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);

ченных знаком 2.1;\u003c0/\u003e4. ближе пятидесяти метров от железнодорожных переездов;\u003c0/\u003e5. механических транспортных средств с работающим двигателем в населенных пунктах, если это создает неудобства жителям;\u003c0/\u003e6. на клумбах, газонах, детских и спортивных площадках.","answers":{"1":"Синего","2":"Обоим запрещена.","3":"Обоим разрешена.","4":"Красного."}},"5":{"title":"В какой последовательности проедут перекресток транспортные средства?","explanation":"11. На перекрестке неравнозначных дорог водитель транспортного средства, движущегося по второстепенной дороге, уступает дорогу транспортным средствам, приближающимся по главной, независимо от направления их дальнейшего движения, в том числе осуществляющим разворот. Водитель, движущийся по главной дороге, имеющей разделительную полосу, перед завершением на перекрестке разворота убеждается, что транспортные средства, приближающиеся к перекрестку по второстепенной дороге, уступают ему дорогу.","answers":{"1":"Мотоцикл, легковой автомобиль, грузовой автомобиль.","2":"Легковой автомобиль, мотоцикл, грузовой автомобиль.","3":"Легковой автомобиль, грузовой автомобиль, мотоцикл."}},"6":{"title":"Водитель синего автомобиля при проезде перекрестка уступит дорогу","explanation":"По требованию дорожных знаков «Уступите дорогу» и «Направление главной дороги», водитель уступает транспортным средствам, находящимся на главной дороге","answers":{"1":"Всем","2":"Автобусу","3":"Автобусу и легковому автомобилю","4":"Никому"}},"7":{"title":"В каких случаях запрещается перевозка детей до 12 лет на мотоциклах?","explanation":"Перевозка детей до 12 лет запрещается на мотоциклах без бокового прицепа","answers":{"1":"Сверх количества, предусмотренного технической характеристикой транспортного средства.","2":"В обоих случаях","3":"На заднем сиденье мотоцикла"}}}}},"drawer":{"Главная страница":"Главная страница","Курсы":"Курсы","Тесты":"Тесты","Детский курс":"Детский курс","Самоподготовка":"Самоподготовка","Книга по ПДД":"
